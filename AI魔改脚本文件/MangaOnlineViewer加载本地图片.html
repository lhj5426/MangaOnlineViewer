<!doctype html>
<html lang='zh-CN'>
<head>
    <meta charset='UTF-8' />
    <meta content='width=device-width, initial-scale=1.0' name='viewport' />
    <title>MangaOnlineViewer 脚本</title>
    <link
            rel='stylesheet'
            href='https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css'
    />
    <style>
        /* ZIP文件按钮 - 橘黄色 */
        #file {
            background-color: #ff9800;
            border-color: #ff9800;
            color: white;
            cursor: pointer;
            padding: 10px 20px;
            border-radius: 5px;
            font-weight: bold;
        }
        #file:hover {
            background-color: #f57c00;
            border-color: #f57c00;
        }

        /* 文件夹按钮 - 绿色 */
        #folder {
            background-color: #4caf50;
            border-color: #4caf50;
            color: white;
            cursor: pointer;
            padding: 10px 20px;
            border-radius: 5px;
            font-weight: bold;
        }
        #folder:hover {
            background-color: #45a049;
            border-color: #45a049;
        }

        /* 图片按钮 - 蓝色 */
        #images {
            background-color: #2196f3;
            border-color: #2196f3;
            color: white;
            cursor: pointer;
            padding: 10px 20px;
            border-radius: 5px;
            font-weight: bold;
        }
        #images:hover {
            background-color: #0b7dda;
            border-color: #0b7dda;
        }

        /* 标签样式优化 */
        label {
            margin-top: 15px;
            display: block;
            font-size: 1.1em;
        }

        /* 输入框容器 */
        .file-input-container {
            margin-bottom: 20px;
        }

        /* 关键字颜色 */
        .keyword-zip {
            color: #ff9800;
            font-weight: bold;
        }

        .keyword-folder {
            color: #4caf50;
            font-weight: bold;
        }

        .keyword-images {
            color: #2196f3;
            font-weight: bold;
        }
    </style>
</head>
<body>
<main id='MangaOnlineViewer' class='container'>
    <h1>MangaOnlineViewer</h1>
    <div id='LocalTest'>
        <h2 id='run-test'>运行本地测试</h2>
        <button type='button' id='test'>运行本地测试</button>
    </div>
    <div id='LocalFiles'>
        <h2>
            本地文件 (ZIP, CBZ, CBR..., PNGs, JPGs...)
        </h2>
        <p>
            <b>注意</b>：您需要为 tampermonkey "允许访问文件网址"，
            只需前往浏览器扩展设置。
        </p>
        <p>
            可以读取任何包含图片的 <span class="keyword-zip">zip</span> 文件，并像任何支持的网站一样显示它
        </p>
        <div class='file-input-container'>
            <label for='file'>📦 选择本地 <span class="keyword-zip">zip 文件</span>：</label>
            <input
                    type='file'
                    id='file'
                    name='file'
                    class='btn'
                    accept='.zip, .cbz, .cbr, .7z, .rar'
                    value=''
            />
        </div>
        <p>注意：您的浏览器将处理 <span class="keyword-zip">zip</span> 文件，不要选择太大的文件！</p>

        <div class='file-input-container'>
            <label for='folder'><b>或</b> 📁 选择<span class="keyword-folder">包含图片的文件夹</span>（支持子文件夹，自动排除cover图片）：</label>
            <input
                    type='file'
                    id='folder'
                    name='folder'
                    class='btn'
                    webkitdirectory
                    mozdirectory
                    directory
                    value=''
            />
        </div>

        <div class='file-input-container'>
            <label for='images'><b>或</b> 🖼️ 选择<span class="keyword-images">图片</span>（自动排除cover图片）：</label>
            <input
                    type='file'
                    id='images'
                    name='images'
                    class='btn'
                    accept='image/*'
                    multiple
                    value=''
            />
        </div>
    </div>
</main>
<script>
// 在MangaOnlineViewer脚本加载前，拦截并过滤文件
(function() {
    console.log('✅ 文件过滤脚本已加载');
    
    // 保存原始的 FileList
    const originalFileListGetter = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'files').get;
    
    // 创建过滤后的 FileList
    function createFilteredFileList(files) {
        const filteredFiles = Array.from(files).filter(file => {
            // 只保留图片文件
            if (!file.type.startsWith('image/')) {
                console.log('⏭️ 跳过非图片文件:', file.name);
                return false;
            }
            
            // 排除文件名包含 cover 的图片（不区分大小写）
            if (file.name.toLowerCase().includes('cover')) {
                console.log('🚫 排除cover图片:', file.name);
                return false;
            }
            
            return true;
        });
        
        // 按路径排序
        filteredFiles.sort((a, b) => {
            const pathA = a.webkitRelativePath || a.name;
            const pathB = b.webkitRelativePath || b.name;
            return pathA.localeCompare(pathB, undefined, { numeric: true, sensitivity: 'base' });
        });
        
        console.log(`✅ 过滤完成: ${files.length} 个文件 → ${filteredFiles.length} 张图片`);
        
        // 创建新的 FileList 对象
        const dataTransfer = new DataTransfer();
        filteredFiles.forEach(file => dataTransfer.items.add(file));
        return dataTransfer.files;
    }
    
    // 监听文件夹选择
    document.addEventListener('DOMContentLoaded', function() {
        const folderInput = document.getElementById('folder');
        const imagesInput = document.getElementById('images');
        
        if (folderInput) {
            folderInput.addEventListener('change', function(e) {
                console.log('📂 文件夹选择事件触发');
                const originalFiles = originalFileListGetter.call(this);
                console.log('📊 原始文件数:', originalFiles.length);
                
                if (originalFiles.length > 0) {
                    const filteredFiles = createFilteredFileList(originalFiles);
                    
                    // 替换 files 属性
                    Object.defineProperty(this, 'files', {
                        value: filteredFiles,
                        writable: false,
                        configurable: true
                    });
                    
                    console.log('📊 过滤后文件数:', filteredFiles.length);
                    if (filteredFiles.length > 0) {
                        console.log('图片列表:', Array.from(filteredFiles).map(f => f.webkitRelativePath || f.name));
                    }
                }
            }, true); // 使用捕获阶段，确保在其他监听器之前执行
        }
        
        if (imagesInput) {
            imagesInput.addEventListener('change', function(e) {
                console.log('🖼️ 图片选择事件触发');
                const originalFiles = originalFileListGetter.call(this);
                console.log('📊 原始文件数:', originalFiles.length);
                
                if (originalFiles.length > 0) {
                    const filteredFiles = createFilteredFileList(originalFiles);
                    
                    // 替换 files 属性
                    Object.defineProperty(this, 'files', {
                        value: filteredFiles,
                        writable: false,
                        configurable: true
                    });
                    
                    console.log('📊 过滤后文件数:', filteredFiles.length);
                }
            }, true);
        }
    });
})();
</script>
<!-- Local file picker only. MangaOnlineViewer itself is injected by the userscript. -->
</body>
</html>
